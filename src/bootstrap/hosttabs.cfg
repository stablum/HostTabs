// HostTabs managed AutoConfig entry point. Firefox ignores this first line.
(function () {
  "use strict";
  const { interfaces: Ci, utils: Cu } = Components;
  try {
    // Firefox 153 exposes Services as a privileged global and no longer ships
    // Services.sys.mjs. Keep the import only as a fallback for older releases.
    const services =
      globalThis.Services ||
      ChromeUtils.importESModule("resource://gre/modules/Services.sys.mjs").Services;
    const profileDir = services.dirsvc.get("ProfD", Ci.nsIFile);
    const bootstrap = profileDir.clone();
    for (const part of ["chrome", "hosttabs", "bootstrap.js"]) {
      bootstrap.append(part);
    }

    // This installation-level loader deliberately does nothing in profiles
    // that do not contain HostTabs. The selected profile owns the source.
    if (bootstrap.exists() && bootstrap.isFile() && !services.appinfo.inSafeMode) {
      services.scriptloader.loadSubScript(
        services.io.newFileURI(bootstrap).spec,
        globalThis,
        "UTF-8"
      );
    }
  } catch (error) {
    Cu.reportError(`[HostTabs] AutoConfig bootstrap failed: ${error.stack || error}`);
  }
})();
